<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2f45ff">
<title>Draw Bridge</title>
<link rel="stylesheet" href="css/style.css">
<script src="vendor/planck.min.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="menu" class="screen">
  <h1>Draw<br>Bridge</h1>
  <div id="levels"></div>
  <button id="likedBtn" class="big">👍 0</button>
</div>

<div id="hud" class="hidden">
  <button id="back" class="round" aria-label="Back">←</button>
  <div id="lvname"></div>
  <div id="meter"><i></i></div>
</div>

<div id="tools" class="hidden">
  <button id="undo" class="round" aria-label="Undo">↶</button>
  <button id="clear" class="round" aria-label="Clear">✕</button>
  <button id="go" class="go">GO</button>
</div>

<div id="result" class="hidden">
  <div id="resEmoji"></div>
  <div class="row">
    <button id="like" class="round xl" aria-label="Like">👍</button>
    <button id="retry" class="round xl" aria-label="Retry">↺</button>
    <button id="next" class="round xl" aria-label="Next level">→</button>
  </div>
</div>

<div id="liked" class="screen hidden">
  <div class="bar"><button id="likedBack" class="round">←</button><h2>👍</h2></div>
  <div id="likeList"></div>
  <button id="saveVideo" class="big">🎬 Save video</button>
</div>

<div id="export" class="screen hidden">
  <div class="stage"><canvas id="out"></canvas><video id="vid" class="hidden" controls playsinline loop></video></div>
  <div id="prog"><i></i></div>
  <div class="row">
    <span id="expDone" class="hidden"><a id="dl" class="big">⬇ Save</a><button id="share" class="big">Share</button></span>
    <button id="closeExp" class="round">✕</button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
