<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#c9b878">
<title>Level 0</title>

fetch('version.txt?' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(v => { v = v.trim(); if (v && v !== '20261027024250' && !location.search.includes('v=' + v)) location.replace(location.pathname + '?v=' + v + location.hash); }).catch(() => {});</script>
<link rel="stylesheet" href="css/style.css?v=20261027024250">

<body>
<canvas id="game"></canvas>

<div id="menu" class="screen hidden">
  <h1>LEVEL 0</h1>
  <p class="sub">you noclipped into the backrooms with a car.<br>reach the exit. the building wants it in pieces.</p>
  <button id="play" class="big">ENTER</button>
  <div id="best"></div>
  <button id="likedBtn" class="big alt">👍 0</button>
</div>

<div id="hud" class="hidden">
  <button id="back" class="round" aria-label="Back">←</button>
  <div id="dist"></div>
  <div id="meter" aria-label="Car left"><i></i></div>
</div>

<div id="pad" class="hidden">
  <div class="lr"><button id="left" class="pad" aria-label="Reverse">◀</button><button id="right" class="pad" aria-label="Gas">▶</button></div>
  <button id="jump" class="pad" aria-label="Hop">⤒</button>
</div>

<div id="result" class="hidden">
  <div id="resEmoji"></div>
  <div id="resText"></div>
  <div class="row">
    <button id="like" class="round xl" aria-label="Like">👍</button>
    <button id="retry" class="round xl" aria-label="Retry">↺</button>
  </div>
</div>

<div id="liked" class="screen hidden">
  <div class="bar"><button id="likedBack" class="round">←</button><h2>👍</h2></div>
  <div id="likeList"></div>
  <button id="saveVideo" class="big">🎬 Save video</button>
</div>

<div id="export" class="screen hidden">
  <div class="stage"><canvas id="out"></canvas><video id="vid" class="hidden" controls playsinline loop></video></div>
  <div id="prog"><i></i></div>
  <div class="row">
    <span id="expDone" class="hidden"><button id="dl" class="big">⬇ Save</button><button id="share" class="big">Share</button></span>
    <button id="closeExp" class="round">✕</button>
  </div>
</div>

<script type="module" src="js/app.js?v=20261027024250"></script>
</body>
</html>
